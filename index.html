<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Téléjournal</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" defer crossorigin="anonymous"
        integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Le Téléjournal</h1>
  <span id="status">Chargement…</span>
  <div class="range" id="range">
    <button data-days="1">Aujourd’hui</button><button data-days="3">3 jours</button><button data-days="7">7 jours</button>
  </div>
</header>

<div class="body">
  <div class="cal" id="head"></div>
  <div class="cal" id="grid"></div>
</div>

<dialog id="player" aria-labelledby="ptitle">
  <div class="bar"><span id="ptitle"></span>
    <span><button id="paudio">Audio seulement</button> &nbsp; <a id="plink" target="_blank" rel="noopener">Voir sur Radio-Canada</a> &nbsp; <button id="pclose">Fermer ✕</button></span>
  </div>
  <video id="video" controls autoplay playsinline></video>
</dialog>

<script src="app.js"></script>
</body>
</html>
